
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sazan Rehab Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Hind Siliguri', 'Inter', 'SolaimanLipi', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .bg-dark-green { background-color: #064e3b; }
    .text-dark-green { color: #064e3b; }
    .border-dark-green { border-color: #064e3b; }
    .bg-yellow-accent { background-color: #facc15; }
    .text-yellow-accent { color: #facc15; }
    
    /* Animation for better transitions */
    .animate-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #064e3b;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #065f46;
    }

    /* Mobile App Bottom Nav Safe Area */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .mobile-bottom-nav {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900 overflow-x-hidden">
  <div id="root"></div>
</body>
</html>
